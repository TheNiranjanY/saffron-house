name: saffron-house

services:
  mysql:
    image: mysql:8.4
    container_name: saffron-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+05:30
      - --local-infile=1
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-saffron_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant}
      MYSQL_USER: ${MYSQL_USER:-restaurant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-restaurantpass}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urestaurant", "-prestaurantpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: saffron-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TS_DATABASE:-restaurant_analytics}
      POSTGRES_USER: ${TS_USER:-restaurant}
      POSTGRES_PASSWORD: ${TS_PASSWORD:-restaurantpass}
      TZ: ${TZ:-Asia/Kolkata}
      PGTZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${TS_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_analytics"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
  timescale_data:
